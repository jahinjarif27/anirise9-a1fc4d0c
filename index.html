    <style>
      /* Pre-hydration splash + hide prerendered SEO shell from users (still in DOM for crawlers) */
      html, body { margin: 0; padding: 0; background: hsl(220 30% 98%); }
      #seo-shell {
        position: fixed; inset: 0; width: 1px; height: 1px;
        overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
        opacity: 0; pointer-events: none; z-index: -1;
      }
      #pre-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: hsl(220 30% 98%); z-index: 9999; transition: opacity .3s ease;
      }
      #pre-splash .ps-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #pre-splash .ps-logo {
        width: 56px; height: 56px; border-radius: 999px;
        background: linear-gradient(135deg, hsl(241 53% 43%), hsl(345 100% 62%));
        box-shadow: 0 10px 30px -10px hsl(241 53% 43% / .45);
      }
      #pre-splash .ps-brand {
        font: 700 20px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: hsl(224 30% 14%); letter-spacing: -0.01em;
      }
      #pre-splash .ps-tag {
        font: 600 9px/1 system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase;
        color: hsl(220 14% 36%); margin-top: 4px;
      }
      #pre-splash .ps-bar { width: 180px; height: 3px; background: hsl(220 25% 92%); border-radius: 999px; overflow: hidden; margin-top: 8px; }
      #pre-splash .ps-bar::after {
        content: ""; display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, hsl(241 53% 43%), hsl(345 100% 62%));
        border-radius: 999px; animation: ps-slide 1.1s ease-in-out infinite;
      }
      @keyframes ps-slide { 0% { transform: translateX(-110%);} 100% { transform: translateX(360%);} }
      #pre-splash.ps-hide { opacity: 0; pointer-events: none; }
    </style>
  </head>

  <body>
    <div id="pre-splash" aria-hidden="true">
      <div class="ps-inner">
        <div class="ps-logo"></div>
        <div style="text-align:center">
          <div class="ps-brand">AniRise</div>
          <div class="ps-tag">Visibility · Growth · Success</div>
        </div>
        <div class="ps-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        function hide(){ var s=document.getElementById('pre-splash'); if(!s) return; s.classList.add('ps-hide'); setTimeout(function(){ s && s.remove(); }, 350); }
        var t=Date.now();
        var i=setInterval(function(){
          var r=document.getElementById('root');
          if((r && r.children && r.children.length>0) || Date.now()-t>8000){ clearInterval(i); hide(); }
        }, 80);
      })();
    </script>
  </body>
