    <style>
      /* Pre-hydration splash. SEO content lives INSIDE #root and is replaced by React on mount — no hidden-text tricks. */
      html, body { margin: 0; padding: 0; background: hsl(220 30% 98%); }
      #pre-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: hsl(220 30% 98%); z-index: 9999; transition: opacity .3s ease;
      }
      #pre-splash .ps-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
      #pre-splash .ps-brand {
        font: 800 22px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: hsl(224 30% 14%); letter-spacing: -0.01em;
      }
      #pre-splash .ps-tag {
        font: 600 9px/1 system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase;
        color: hsl(220 14% 36%); margin-top: 6px;
      }
      #pre-splash .ps-bar { width: 180px; height: 3px; background: hsl(220 25% 92%); border-radius: 999px; overflow: hidden; margin-top: 8px; }
      #pre-splash .ps-bar::after {
        content: ""; display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, hsl(241 53% 43%), hsl(345 100% 62%));
        border-radius: 999px; animation: ps-slide 1.1s ease-in-out infinite;
      }
      @keyframes ps-slide { 0% { transform: translateX(-110%);} 100% { transform: translateX(360%);} }
      #pre-splash.ps-hide { opacity: 0; pointer-events: none; }
      /* Prerendered shell inside #root — visible during initial paint but covered by splash. */
      #root > .seo-shell { color: hsl(224 30% 14%); font-family: system-ui, sans-serif; line-height: 1.55; }
      #root > .seo-shell h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 .75rem; }
      #root > .seo-shell nav ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .75rem; }
      #root > .seo-shell main, #root > .seo-shell header, #root > .seo-shell footer { max-width: 70rem; margin: 0 auto; padding: 1rem; }
    </style>
  </head>

  <body>
    <div id="pre-splash" aria-hidden="true">
      <div class="ps-inner">
        <div>
          <div class="ps-brand">AniRise</div>
          <div class="ps-tag">Visibility · Growth · Success</div>
        </div>
        <div class="ps-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function(){
        // Detect known crawlers — they get NO splash overlay so rendered screenshots match real content.
        var ua = (navigator.userAgent || "").toLowerCase();
        var isBot = /googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|sogou|exabot|facebot|facebookexternalhit|twitterbot|linkedinbot|embedly|whatsapp|telegrambot|applebot|petalbot|ahrefsbot|semrushbot|mj12bot|seobility/i.test(ua);
        if (isBot) {
          var s0 = document.getElementById('pre-splash');
          if (s0) s0.remove();
          return;
        }
        function hide(){ var s=document.getElementById('pre-splash'); if(!s) return; s.classList.add('ps-hide'); setTimeout(function(){ s && s.remove(); }, 350); }
        var t=Date.now();
        var i=setInterval(function(){
          var r=document.getElementById('root');
          // React replaced the prerendered shell when first child no longer has the .seo-shell class
          var ready = r && r.firstElementChild && !r.firstElementChild.classList.contains('seo-shell');
          if(ready || Date.now()-t>8000){ clearInterval(i); hide(); }
        }, 80);
      })();
    </script>
  </body>
